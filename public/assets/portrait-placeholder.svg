<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="canvasGrad" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#142936" />
      <stop offset="45%" stop-color="#0E1E28" />
      <stop offset="100%" stop-color="#071016" />
    </linearGradient>

    <radialGradient id="portraitGlow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#C8A86B" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#C8A86B" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0E1E28" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2C992" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#C8A86B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9E7D43" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D2A32" />
      <stop offset="50%" stop-color="#14222B" />
      <stop offset="100%" stop-color="#0A141A" />
    </linearGradient>

    <linearGradient id="lapelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24343E" />
      <stop offset="100%" stop-color="#101D24" />
    </linearGradient>
  </defs>

  <!-- Deep Sovereign Backdrop -->
  <rect width="600" height="750" fill="url(#canvasGrad)" />

  <!-- Diplomatic Backlight Glow -->
  <circle cx="300" cy="285" r="240" fill="url(#portraitGlow)" />

  <!-- Archival Framing -->
  <rect x="20" y="20" width="560" height="710" fill="none" stroke="url(#goldBorder)" stroke-width="1.2" />
  <rect x="28" y="28" width="544" height="694" fill="none" stroke="#C8A86B" stroke-width="0.5" stroke-opacity="0.25" />

  <!-- Dignified Executive Portrait Silhouette -->
  <g transform="translate(300, 290)">
    <!-- Shoulders & Tailored Suit -->
    <path d="M-190 320 C-180 200 -120 155 -55 145 L-35 125 L35 125 L55 145 C120 155 180 200 190 320 Z" fill="url(#suitGrad)" />

    <!-- Left & Right Suit Lapels -->
    <path d="M-55 145 L-15 260 L-45 320 L-140 320 C-130 220 -95 170 -55 145 Z" fill="url(#lapelGrad)" />
    <path d="M55 145 L15 260 L45 320 L140 320 C130 220 95 170 55 145 Z" fill="url(#lapelGrad)" />

    <!-- Crisp White Collar & Sovereign Tie -->
    <polygon points="0,135 -24,195 0,210 24,195" fill="#F8F9F8" opacity="0.9" />
    <polygon points="-8,198 8,198 14,320 -14,320" fill="#0E1E28" />
    <line x1="0" y1="205" x2="0" y2="310" stroke="#C8A86B" stroke-width="1" opacity="0.6" />

    <!-- Diplomatic Insignia Ribbon (National Order of Valor) -->
    <path d="M-42 220 L-32 232 L-22 220 L-22 228 L-32 240 L-42 228 Z" fill="#C8A86B" opacity="0.85" />
    <circle cx="-32" cy="245" r="4.5" fill="#E2C992" />

    <!-- Head & Neck Contour -->
    <rect x="-24" y="90" width="48" height="50" rx="6" fill="#D2B596" opacity="0.85" />
    <ellipse cx="0" cy="40" rx="68" ry="85" fill="#D2B596" opacity="0.9" />

    <!-- Executive Hair / Scholarly Profile Contour -->
    <path d="M-68 35 C-70 -25 -40 -50 0 -52 C40 -50 70 -25 68 35 C60 10 40 -15 0 -15 C-40 -15 -60 10 -68 35 Z" fill="#141E24" />

    <!-- Refined Spectacles (Scholarship) -->
    <rect x="-46" y="24" width="36" height="22" rx="4" fill="none" stroke="#C8A86B" stroke-width="1.8" opacity="0.9" />
    <rect x="10" y="24" width="36" height="22" rx="4" fill="none" stroke="#C8A86B" stroke-width="1.8" opacity="0.9" />
    <line x1="-10" y1="33" x2="10" y2="33" stroke="#C8A86B" stroke-width="1.6" opacity="0.9" />
  </g>

  <!-- Elegant Corner Monogram Seal -->
  <g transform="translate(520, 72)">
    <circle cx="0" cy="0" r="22" fill="#071016" stroke="#C8A86B" stroke-width="0.8" stroke-opacity="0.8" />
    <text x="0" y="5" text-anchor="middle" fill="#E2C992" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">
      KMK
    </text>
  </g>
</svg>
